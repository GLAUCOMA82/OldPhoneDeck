<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824">
  <!-- PhoneDeck app icon: a Mac with an iPad and an iPhone connected to it, on an Apple-style glass squircle. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FB6FF"/>
      <stop offset=".55" stop-color="#0A7CFF"/>
      <stop offset="1" stop-color="#3B3FE0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".18" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A4E"/>
      <stop offset="1" stop-color="#0B1022"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE6F5"/>
    </linearGradient>
    <linearGradient id="tileA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9230"/><stop offset="1" stop-color="#FF4245"/></linearGradient>
    <linearGradient id="tileB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3CD3FE"/><stop offset="1" stop-color="#0091FF"/></linearGradient>
    <linearGradient id="tileC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6EE7A0"/><stop offset="1" stop-color="#30D158"/></linearGradient>
    <linearGradient id="tileD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C48BFF"/><stop offset="1" stop-color="#6D7CFF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#06135A" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- squircle (Apple icon grid: 824 pt shape inside 1024) -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#glow)"/>

  <!-- connection arcs -->
  <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 26" opacity=".75">
    <path d="M262 498 C 300 420, 340 400, 360 400"/>
    <path d="M770 520 C 740 430, 700 405, 664 400"/>
  </g>

  <g filter="url(#shadow)">
    <!-- Mac (display + stand) -->
    <rect x="322" y="268" width="380" height="262" rx="30" fill="url(#body)"/>
    <rect x="342" y="288" width="340" height="208" rx="14" fill="url(#screen)"/>
    <rect x="368" y="314" width="70" height="70" rx="17" fill="url(#tileA)"/>
    <rect x="452" y="314" width="70" height="70" rx="17" fill="url(#tileB)"/>
    <rect x="536" y="314" width="122" height="70" rx="17" fill="#fff" opacity=".9"/>
    <rect x="368" y="398" width="154" height="74" rx="17" fill="url(#tileD)"/>
    <rect x="536" y="398" width="54" height="74" rx="15" fill="url(#tileC)"/>
    <rect x="604" y="398" width="54" height="74" rx="15" fill="#fff" opacity=".35"/>
    <path d="M472 530h80l14 70h-108z" fill="#C9D6EA"/>
    <rect x="420" y="596" width="184" height="18" rx="9" fill="url(#body)"/>

    <!-- iPad (landscape, left) -->
    <rect x="132" y="500" width="250" height="180" rx="28" fill="url(#body)"/>
    <rect x="148" y="516" width="218" height="148" rx="14" fill="url(#screen)"/>
    <rect x="164" y="532" width="86" height="56" rx="13" fill="url(#tileB)"/>
    <rect x="262" y="532" width="88" height="56" rx="13" fill="url(#tileA)"/>
    <rect x="164" y="600" width="186" height="48" rx="13" fill="#fff" opacity=".85"/>

    <!-- iPhone (landscape, right) -->
    <rect x="652" y="528" width="236" height="122" rx="30" fill="url(#body)"/>
    <rect x="668" y="542" width="204" height="94" rx="18" fill="url(#screen)"/>
    <rect x="684" y="556" width="40" height="40" rx="10" fill="url(#tileC)"/>
    <rect x="732" y="556" width="40" height="40" rx="10" fill="url(#tileD)"/>
    <rect x="780" y="556" width="40" height="40" rx="10" fill="url(#tileA)"/>
    <rect x="828" y="556" width="30" height="40" rx="10" fill="url(#tileB)"/>
    <rect x="684" y="604" width="174" height="20" rx="10" fill="#fff" opacity=".85"/>
  </g>
</svg>
